<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jose Rios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f1f5f9;
      text-align: center;
    }
    .card { max-width: 600px; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: .5rem; }
    p  { font-size: 1.1rem; color: #94a3b8; margin-bottom: 1.5rem; }
    a.button {
      display: inline-block;
      padding: .7rem 1.5rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a.button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jose Rios</h1>
    <p>Desarrollador / Estudiante</p>
    <a class="button" href="https://github.com/Torukmaktocode">Ver mi GitHub</a>
  </div>
</body>
</html>
